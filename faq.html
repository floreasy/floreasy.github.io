    function FaqItem({ q, a, idx }) {
      const [open, setOpen] = React.useState(false);
      return (
        <div className="faq-item">
          <button type="button" className="faq-q" aria-expanded={open} onClick={() => setOpen(o => !o)}>
            <span>{q}</span>
            <span className="sign" aria-hidden="true"></span>
          </button>
          <div className={`faq-a${open ? " open" : ""}`}>{a}</div>
        </div>
      );
    }

    function FaqPage() {
      useCurtainTransitions("var(--pink)");
      useReveal();

      // Données structurées FAQ (JSON-LD) pour le référencement / rich results Google
      React.useEffect(() => {
        const data = {
          "@context": "https://schema.org",
          "@type": "FAQPage",
          "mainEntity": FAQ.flatMap(s => s.items).map(it => ({
            "@type": "Question",
            "name": it.q,
            "acceptedAnswer": { "@type": "Answer", "text": it.plain },
          })),
        };
        const tag = document.createElement("script");
        tag.type = "application/ld+json";
        tag.id = "faq-jsonld";
        tag.textContent = JSON.stringify(data);
        document.head.appendChild(tag);
        return () => { const e = document.getElementById("faq-jsonld"); if (e) e.remove(); };
      }, []);

      return (
        <>
          <SiteHeader active="faq" />

          {/* Hero */}
          <section style={{ background: "var(--pink)", padding: "80px 32px 56px", borderBottom: "1.5px solid var(--ink)" }}>
            <div style={{ maxWidth: "var(--maxw)", margin: "0 auto" }}>
              <div className="eyebrow">FAQ</div>
              <h1 className="h-display">
                Vos questions,<br/>
                <span style={{ background: "var(--yellow)", padding: "0 .1em" }}>mes réponses</span>
              </h1>
              <p className="h-serif" style={{ marginTop: 28, maxWidth: "32ch" }}>
                <em>Tout ce qu'il faut savoir avant de programmer une conférence ou un atelier.</em>
              </p>
              <div className="faq-chips" style={{ marginTop: 36 }}>
                {FAQ.map(s => (
                  <a key={s.id} href={`#${s.id}`}>{s.num} · {s.title.replace("\n", " ")}</a>
                ))}
              </div>
            </div>
          </section>

          {/* Sections */}
          {FAQ.map(sec => (
            <section key={sec.id} id={sec.id} className="page reveal">
              <div className="faq-sec">
                <div className="faq-sec-head">
                  <div className="faq-sec-num">{sec.num}</div>
                  <h2 className="h-section" style={{ whiteSpace: "pre-line" }}>{sec.title}</h2>
                </div>
                {sec.items.map((it, ii) => <FaqItem key={ii} q={it.q} a={it.a} idx={ii} />)}
              </div>
            </section>
          ))}

          {/* CTA */}
          <section className="page reveal" style={{ textAlign: "center", padding: "100px 32px" }}>
            <div className="eyebrow" style={{ justifyContent: "center" }}>Une autre question ?</div>
            <h2 className="h-display" style={{ marginBottom: 32, fontSize: "clamp(40px, 6vw, 84px)" }}>
              Parlons-en
            </h2>
            <a href="contact.html" className="btn">Programmer une intervention <span className="arrow">→</span></a>
          </section>

          <SiteFooter />
          <PascalTweaks />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<FaqPage />);
