<style>
  /* ===== FAQ ===== */
  .faq-chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .faq-chips a {
    font-family: var(--font-display); text-transform: uppercase;
    font-size: 12px; letter-spacing: .04em;
    border: 1.5px solid var(--ink); border-radius: 999px;
    padding: 9px 16px; transition: background .15s, color .15s;
  }
  .faq-chips a:hover { background: var(--ink); color: var(--paper); }

  .faq-sec { border-top: 1.5px solid var(--ink); }
  .faq-sec-head {
    display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: baseline;
    padding: 14px 0 28px;
  }
  .faq-sec-num {
    font-family: var(--font-display); line-height: .8; letter-spacing: -.04em;
    font-size: clamp(48px, 8vw, 120px);
    -webkit-text-stroke: 1.5px var(--ink); color: transparent;
  }
  .faq-item { border-top: 1.5px solid var(--ink); }
  .faq-sec .faq-item:first-of-type { border-top: none; }
  .faq-q {
    width: 100%; text-align: left; background: transparent; border: none; cursor: pointer;
    color: inherit; font: inherit;
    display: flex; align-items: center; justify-content: space-between; gap: 24px;
    padding: 24px 0;
    font-family: var(--font-display); text-transform: uppercase;
    font-size: clamp(16px, 1.7vw, 24px); line-height: 1.1; letter-spacing: -.01em;
    transition: color .15s;
  }
  .faq-q:hover { color: var(--pink); }
  .faq-q .sign {
    flex: none; width: 30px; height: 30px; position: relative;
    border: 1.5px solid currentColor; border-radius: 50%;
  }
  .faq-q .sign::before, .faq-q .sign::after {
    content: ""; position: absolute; background: currentColor;
    top: 50%; left: 50%; transform: translate(-50%,-50%);
  }
  .faq-q .sign::before { width: 12px; height: 2px; }
  .faq-q .sign::after { width: 2px; height: 12px; transition: transform .3s; }
  .faq-q[aria-expanded="true"] .sign::after { transform: translate(-50%,-50%) rotate(90deg); opacity: 0; }
  .faq-a {
    max-height: 0; overflow: hidden; opacity: 0;
    transition: max-height .45s ease, opacity .45s ease, padding .45s ease;
  }
  .faq-a.open { max-height: 3000px; opacity: 1; padding-bottom: 32px; }
  .faq-a .inner { max-width: 80ch; }
  .faq-a p { margin-bottom: 14px; font-size: clamp(16px,1.2vw,19px); line-height: 1.55; }
  .faq-a ul, .faq-a ol { margin: 0 0 16px 0; padding-left: 4px; display: grid; gap: 10px; list-style: none; }
  .faq-a li { padding-left: 26px; position: relative; font-size: clamp(16px,1.2vw,19px); line-height: 1.5; }
  .faq-a ul li::before { content: ""; position: absolute; left: 2px; top: .55em; width: 10px; height: 10px; background: var(--pink); }
  .faq-a ol { counter-reset: faqc; }
  .faq-a ol li { counter-increment: faqc; }
  .faq-a ol li::before { content: counter(faqc); position: absolute; left: 0; top: 0; font-family: var(--font-display); font-size: 14px; color: var(--pink); }
  .faq-a strong { font-weight: 600; }
  .faq-a a.inline { border-bottom: 2px solid var(--pink); white-space: nowrap; }
  .faq-tip { background: var(--yellow); border: 1.5px solid var(--ink); padding: 14px 18px; margin: 4px 0 16px; font-family: var(--font-serif); font-style: italic; font-size: 17px; }
  .faq-table-wrap { overflow-x: auto; margin: 6px 0 18px; }
  .faq-table { width: 100%; border-collapse: collapse; font-size: 15px; min-width: 460px; }
  .faq-table th, .faq-table td { border: 1.5px solid var(--ink); padding: 12px 14px; text-align: left; vertical-align: top; }
  .faq-table th { font-family: var(--font-display); text-transform: uppercase; font-size: 11px; letter-spacing: .04em; background: var(--ink); color: var(--paper); }
  @media (max-width: 900px) { .faq-sec-head { grid-template-columns: 1fr; gap: 6px; } }
